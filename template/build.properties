# Path to j2me-build-common. Scaffolded projects use the per-machine shared
# copy at ${user.home}/.j2me-build-common (or --common-dir at another copy).
# Forward slashes work on Windows.
common.dir=__COMMON_DIR__
project.output=__PROJECT_OUTPUT__
jdk.path=__JDK_PATH__
java.source=__JAVA_SOURCE__
java.target=__JAVA_TARGET__
# Optional overrides:
# libs.dir=${common.dir}/libs
# proguard.jar=${common.dir}/tools/proguard-4.4.jar
# Extra compile-only JARs (project-local, never bundled; missing dir is ignored):
# extra.libs.dir=ext-libs
# Microemulator-only: allow J2SE APIs at compile (rt.jar first on bootclasspath).
# Output will NOT run on real devices. Requires a JDK with jre/lib/rt.jar:
# java.api=se
# ZKM (obfuscate-zkm / zkm-build) overrides:
# zkm.home=C:/Tools/ZKM
# zkm.jar=C:/Tools/ZKM/ZKM.jar
# zkm.script=ZKM.txt
# zkm.verbose=true
# zkm.parseonly=false
# zkm.output.jar=target/dist/__PROJECT_OUTPUT___zkm.jar
# OPEN_CLASSES=target/dist/__PROJECT_OUTPUT___obf.jar
# SAVE_DIR=target/dist/zkm-obfuscated
